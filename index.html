<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0d2332">
  <meta name="description" content="مكتبتي الطبية — مكتبة محاضرات شخصية تعمل دون إنترنت على الآيفون والآيباد.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مكتبتي الطبية">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>مكتبتي الطبية | Medical Library</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar" aria-label="قائمة التنقل الرئيسية">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M10 14.5c5-5 11-3.5 14 0 3-3.5 9-5 14 0 6 7-2 16-14 24C12 30.5 4 21.5 10 14.5Z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M12 25h7l3.2-6 4.4 12 3.2-6H36" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div><strong>مكتبتي الطبية</strong><small>MY MEDICAL LIBRARY</small></div>
      </div>
      <div class="side-section-label">المكتبة</div>
      <nav class="side-nav" id="desktop-nav">
        <button class="nav-link active" data-nav="home"><span class="nav-icon" data-icon="home"></span> الرئيسية</button>
        <button class="nav-link" data-nav="subjects"><span class="nav-icon" data-icon="books"></span> المواد الدراسية</button>
        <button class="nav-link" data-nav="backup"><span class="nav-icon" data-icon="backup"></span> النسخ والمشاركة</button>
        <button class="nav-link" data-nav="guide"><span class="nav-icon" data-icon="help"></span> المساعدة والتثبيت</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="storage-card"><div class="storage-top"><span class="status-dot"></span><strong>مكتبة محفوظة على جهازك</strong></div><p>المحاضرات التي تضيفها تُحفظ محليًا، ولا تُرفع إلى خادم.</p><div class="storage-meter"><span id="storage-meter"></span></div><small id="storage-text">جاري فحص التخزين…</small></div>
        <div class="side-footer">الإصدار 1.0 · صُمم للدراسة براحة</div>
      </div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-right"><span class="mobile-brand-mark" aria-hidden="true">✦</span><div><strong id="header-title">الرئيسية</strong><small id="header-subtitle">كل محاضراتك في مكان واحد</small></div></div>
        <div class="topbar-left"><span class="connection" id="connection" role="status">جاري التحقق…</span><button class="icon-btn" id="quick-backup-btn" title="النسخ والمشاركة" aria-label="النسخ والمشاركة"><span data-icon="backup"></span></button></div>
      </header>
      <div class="main-content" id="main-content">
        <div class="loading-center"><div class="spinner"></div><p>جاري تجهيز مكتبتك…</p></div>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="التنقل على الهاتف">
      <button class="bottom-link active" data-nav="home"><span data-icon="home"></span><small>الرئيسية</small></button>
      <button class="bottom-link" data-nav="subjects"><span data-icon="books"></span><small>المواد</small></button>
      <button class="bottom-link" data-nav="backup"><span data-icon="backup"></span><small>النسخ</small></button>
      <button class="bottom-link" data-nav="guide"><span data-icon="help"></span><small>المساعدة</small></button>
    </nav>
  </div>

  <div id="modal-root" aria-live="polite"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <div id="reader-root"></div>
  <input id="backup-import-input" class="sr-only" type="file" accept=".medlib,application/octet-stream">
  <script src="./app.js" defer></script>
</body>
</html>
